# 工作流名称
name: Generate OrangePi5-Max Gnome Image

# 触发条件：仅手动触发
on:
  workflow_dispatch:
    # 可选：添加自定义输入参数（如需灵活调整编译参数可启用）
    inputs:
      board:
        description: '目标开发板型号'
        required: true
        default: 'orangepi5-max'
        type: string
      desktop_env:
        description: '桌面环境'
        required: true
        default: 'gnome'
        type: string

# 作业定义
jobs:
  build-and-upload-image:
    # 运行环境：Ubuntu 24.04
    runs-on: ubuntu-24.04
    # 设置超时时间（编译镜像耗时较长，建议设为6小时）
    timeout-minutes: 360

    steps:
      - name: Get more disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      # 步骤1：检出代码仓库（确保compile.sh在仓库根目录）
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # 如需拉取子模块（如有）请启用
          # submodules: recursive
          fetch-depth: 0

      # 步骤2：安装编译依赖（根据compile.sh实际需求调整）
      - name: Install Build Dependencies
        run: |
          sudo apt update -y
          sudo apt upgrade -y
          # 通用编译依赖（Armbian/OrangePi镜像编译常用）
          sudo apt install -y \
            git build-essential curl wget unzip zip \
            qemu-user-static binfmt-support python3 python3-pip \
            rsync bc bison flex libssl-dev parted dosfstools \
            squashfs-tools imagemagick jq zstd

      # 步骤3：赋予compile.sh执行权限
      - name: Make compile.sh Executable
        run: chmod +x ./compile.sh

      # 步骤4：执行编译脚本生成镜像
      - name: Build OrangePi Image
        run: |
          ./compile.sh build \
            BOARD=${{ github.event.inputs.board }} \
            BRANCH=edge \
            BUILD_DESKTOP=yes \
            BUILD_MINIMAL=no \
            DESKTOP_APPGROUPS_SELECTED='browsers chat desktop_tools editors email internet multimedia office programming remote_desktop' \
            DESKTOP_ENVIRONMENT=${{ github.event.inputs.desktop_env }} \
            DESKTOP_ENVIRONMENT_CONFIG_NAME=config_base \
            KERNEL_CONFIGURE=no \
            RELEASE=plucky
        # 可选：输出编译日志到文件（便于调试）
        env:
          # 强制输出详细日志
          VERBOSE: 1

      # 步骤5：列出生成的镜像文件（便于确认路径，调试用）
      - name: List Generated Image Files
        run: |
          echo "=== 列出output目录结构 ==="
          ls -la ./output/ || true
          echo "=== 列出images目录文件 ==="
          ls -la ./output/images/ || true

      # 步骤6：上传镜像文件到Artifacts
      - name: Upload Image Artifacts
        uses: actions/upload-artifact@v4
        with:
          # Artifact名称（便于识别）
          name: orangepi5-max-gnome-image-${{ github.run_id }}
          # 镜像文件路径（根据compile.sh实际输出路径调整！）
          # 常见路径：output/images/ 下的.img/.xz/.zip/.sha256sum等
          path: |
            ./output/images/*.img
            ./output/images/*.img.xz
            ./output/images/*.img.zip
            ./output/images/*.sha256sum
            ./output/images/*.md5sum
          # 产物保留天数（默认90天，可根据需求调整）
          retention-days: 90
          # 启用并行上传（加快大文件上传速度）
          if-no-files-found: error  # 无文件时触发错误（避免漏传）