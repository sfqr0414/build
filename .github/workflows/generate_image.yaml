name: Generate OrangePi5-Max Gnome Image (Gist Backup Mode)

on:
  workflow_dispatch:
    inputs:
      board: { required: true, default: 'orangepi5-max', type: string }
      kernel: { required: true, default: 'edge', type: string }
      release: { required: true, default: 'plucky', type: string }
      desktop_env: { required: true, default: 'gnome', type: string }

jobs:
  build-and-upload-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      # 使用具有 gist 权限的 PAT
      GH_TOKEN: ${{ secrets.GIST_PAT }} 
    steps:
      # 1. 极致清理
      - name: Extreme Cleanup
        run: |
          sudo rm -rf /home/runner/actions-runner/cached/_diag/* || true
          sudo rm -rf /home/runner/_diag/* || true
          sudo docker system prune -a -f || true
          sudo apt-get clean
          sudo apt-get autoremove -y --purge
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          sudo rm -rf /var/lib/apt/lists/* || true
          sudo rm -rf ${{ github.workspace }}/build/* ${{ github.workspace }}/images/* || true
          sudo rm -rf /tmp/* /var/tmp/* || true
          df -h

      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. 启动 Gist 监控守护进程
      - name: Start Gist Backup Watchdog
        run: |
          touch ./build-image.log
          # 先创建一个初始 Gist 并记录 ID
          GIST_URL=$(gh gist create ./build-image.log -d "Build Log for ${{ github.run_id }}" --public=false)
          GIST_ID=$(echo $GIST_URL | awk -F/ '{print $NF}')
          echo "GIST_ID=$GIST_ID" >> $GITHUB_ENV
          echo "Initial Gist created: $GIST_URL"

          # 后台监控与上传
          bash -c "
          while true
          do
              sleep 600 # 每10分钟备份一次
              TIMESTAMP=\$(date +%H:%M:%S)
              AVAIL=\$(df / | tail -1 | awk '{print \$4}')
              
              echo \"--- Log Snapshot at \$TIMESTAMP (Avail: \${AVAIL}KB) ---\" >> ./build-image.log
              
              # 临终备份：推送到 Gist
              # 使用 edit 命令覆盖原有 Gist 内容，不产生新文件
              gh gist edit $GIST_ID ./build-image.log > /dev/null 2>&1 && echo \"Gist backup successful at \$TIMESTAMP\"
              
              # 磁盘预警：少于 2GB 则强制退出前最后同步一次
              if [ \"\$AVAIL\" -lt 2097152 ]; then
                echo \"DISK CRITICAL! Last sync...\"
                du -sh /* 2>/dev/null | sort -rh | head -n 5 >> ./build-image.log
                gh gist edit $GIST_ID ./build-image.log
                exit 1
              fi
          done
          " &
          echo $! > watchdog.pid
        shell: bash

      # 3. 执行编译 (强制行缓冲输出)
      - name: Build OrangePi Image
        run: |
          chmod +x ./compile.sh
          export USE_TMPFS=no
          # stdbuf -oL 确保每一行日志都立即写入文件供后台进程读取
          stdbuf -oL ./compile.sh build \
            BOARD=${{ github.event.inputs.board }} \
            BRANCH=${{ github.event.inputs.kernel }} \
            BUILD_DESKTOP=yes \
            BUILD_MINIMAL=no \
            DESKTOP_APPGROUPS_SELECTED='browsers desktop_tools editors multimedia' \
            DESKTOP_ENVIRONMENT=${{ github.event.inputs.desktop_env }} \
            DESKTOP_ENVIRONMENT_CONFIG_NAME=config_base \
            RELEASE=${{ github.event.inputs.release }} \
            ENABLE_EXTENSIONS=override-kernel \
            2>&1 | stdbuf -oL tee >(sed 's/\x1B\[[0-9;]*[a-zA-Z]//g' >> ./build-image.log)

      - name: List Products & Final Disk Check
        if: always()
        run: |
          echo "=== 输出目录结构 ==="
          ls -la ./output/ || true
          echo "=== 镜像文件列表 ==="
          ls -la ./output/images/ || true
          echo -e "\n=== 最终磁盘使用率 ==="
          df -h
        shell: bash

      - name: Upload Image Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orangepi5-max-gnome-image-${{ github.run_id }}
          path: |
            ./output/images/*.img
            ./output/images/*.img.xz
            ./output/images/*.img.zip
            ./output/images/*.sha256sum
            ./output/images/*.md5sum
          retention-days: 90
          if-no-files-found: warn
          
      # 4. 停止并上传最后状态
      - name: Stop Watchdog & Final Gist Sync
        if: always()
        run: |
          [ -f watchdog.pid ] && kill \$(cat watchdog.pid) || true
          if [ -n "$GIST_ID" ]; then
            echo "Performing final Gist sync..."
            gh gist edit $GIST_ID ./build-image.log || true
            echo "Final Gist Link: gist.github.com"
          fi
        shell: bash

      - name: Upload Logs to Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-final
          path: ./build-image.log

      
