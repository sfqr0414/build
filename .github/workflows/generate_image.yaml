# 工作流名称
name: Generate OrangePi5-Max Gnome Image

# 触发条件：仅手动触发
on:
  workflow_dispatch:
    inputs:
      board:
        description: '目标开发板型号'
        required: true
        default: 'orangepi5-max'
        type: string
      kernel:
        description: '内核版本（如6.8/6.6.15）'
        required: true
        default: '6.8'  # 默认指定6.8内核版本
        type: string
      release:
        description: '发行版'
        required: true
        default: 'plucky'
        type: string
      desktop_env:
        description: '桌面环境'
        required: true
        default: 'gnome'
        type: string

# 作业定义
jobs:
  build-and-upload-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 360  # 编译镜像超时时间（6小时）

    steps:
      - name: Get more disk space
        run: |
          sudo rm -rf /home/runner/actions-runner/cached/_diag/* || true
          sudo rm -rf /home/runner/_diag/* || true
          sudo docker system prune -a -f || true
          sudo apt-get clean
          sudo apt-get autoremove -y --purge
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          sudo rm -rf /var/lib/apt/lists/* || true
          sudo rm -rf ${{ github.workspace }}/build/* ${{ github.workspace }}/images/* || true
          sudo rm -rf /tmp/* /var/tmp/* || true
          df -h
          
      # 步骤1：检出代码仓库
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 步骤2：安装编译依赖
      - name: Install Build Dependencies
        run: |
          sudo apt update -y
          sudo apt upgrade -y
          # Armbian/OrangePi 镜像编译完整依赖
          sudo apt install -y \
            git build-essential curl wget unzip zip \
            qemu-user-static binfmt-support python3 python3-pip \
            rsync bc bison flex libssl-dev parted dosfstools \
            squashfs-tools imagemagick jq zstd \
            libncurses5-dev libncursesw5-dev libelf-dev dwarves \
            u-boot-tools device-tree-compiler

      # 步骤3：赋予compile.sh执行权限
      - name: Make compile.sh Executable
        run: chmod +x ./compile.sh

      # 步骤4：执行编译脚本（核心：指定6.8内核版本）
      - name: Build OrangePi Image
        run: |
          ./compile.sh build \
            BOARD=${{ github.event.inputs.board }} \
            BRANCH=edge \  # Armbian构建分支（固定为edge，与内核版本无关）
            KERNEL_VERSION=${{ github.event.inputs.kernel }} \  # 指定6.8内核版本
            BUILD_DESKTOP=yes \
            BUILD_MINIMAL=no \
            DESKTOP_APPGROUPS_SELECTED='browsers chat desktop_tools editors email internet multimedia office programming remote_desktop' \
            DESKTOP_ENVIRONMENT=${{ github.event.inputs.desktop_env }} \
            DESKTOP_ENVIRONMENT_CONFIG_NAME=config_base \
            KERNEL_CONFIGURE=no \
            RELEASE=${{ github.event.inputs.release }}
        env:
          VERBOSE: 1  # 输出详细编译日志，便于调试

      # 步骤5：列出生成的镜像文件（调试用）
      - name: List Generated Image Files
        run: |
          echo "=== 输出目录结构 ==="
          ls -la ./output/ || true
          echo "=== 镜像文件列表 ==="
          ls -la ./output/images/ || true

      # 步骤6：上传镜像产物
      - name: Upload Image Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orangepi5-max-gnome-image-${{ github.run_id }}-kernel-${{ github.event.inputs.kernel }}
          path: |
            ./output/images/*.img
            ./output/images/*.img.xz
            ./output/images/*.img.zip
            ./output/images/*.sha256sum
            ./output/images/*.md5sum
          retention-days: 90
          if-no-files-found: error  # 无镜像文件时触发错误，避免空产物
