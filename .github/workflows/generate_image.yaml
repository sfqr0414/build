name: Generate OrangePi5-Max Gnome Image

on:
  workflow_dispatch:
    inputs:
      board: { required: true, default: 'orangepi5-max', type: string }
      kernel: { required: true, default: 'edge', type: string }
      release: { required: true, default: 'plucky', type: string }
      desktop_env: { required: true, default: 'gnome', type: string }

jobs:
  build-and-upload-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      # 使用具有 gist 权限的 PAT
      GH_TOKEN: ${{ secrets.GIST_PAT }} 
    steps:
      # 1. 极致清理
      - name: Get more disk space
        run: |
          sudo rm -rf /home/runner/actions-runner/cached/_diag/* || true
          sudo rm -rf /home/runner/_diag/* || true
          sudo docker system prune -a -f || true
          sudo apt-get clean
          sudo apt-get autoremove -y --purge
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          sudo rm -rf /var/lib/apt/lists/* || true
          sudo rm -rf ${{ github.workspace }}/build/* ${{ github.workspace }}/images/* || true
          sudo rm -rf /tmp/* /var/tmp/* || true
          df -h

      # 步骤1：检出代码仓库（确保compile.sh在仓库根目录）
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # 如需拉取子模块（如有）请启用
          # submodules: recursive
          fetch-depth: 0

      # 步骤2：安装编译依赖（根据compile.sh实际需求调整）
      - name: Install Build Dependencies
        run: |
          sudo apt update -y >/dev/null 2>&1
          sudo apt install -y --no-install-recommends \
            git build-essential curl wget unzip zip \
            qemu-user-static binfmt-support python3 python3-pip \
            rsync bc bison flex libssl-dev parted dosfstools \
            squashfs-tools imagemagick jq zstd

      - name: Start Gist Backup Watchdog
        run: |
          touch ./build-image.log
          # 初始化日志文件，确保不为空
          echo "=== Build Start: $(date) ===" > ./build-image.log
          echo "Board: ${{ github.event.inputs.board }}" >> ./build-image.log
          
          # 先创建一个初始 Gist 并记录 ID
          GIST_URL=$(gh gist create ./build-image.log -d "Build Log for ${{ github.run_id }}" --public=false)
          GIST_ID=$(echo $GIST_URL | awk -F/ '{print $NF}')
          echo "GIST_ID=$GIST_ID" >> $GITHUB_ENV
          echo "Initial Gist created: $GIST_URL"
      
          # 后台监控与上传
          bash -c "
          while true
          do
              sleep 600 # 每10分钟备份一次
              TIMESTAMP=\$(date +%H:%M:%S)
              AVAIL=\$(df / | tail -1 | awk '{print \$4}')
              
              # 步骤1：创建原始日志的临时副本（每次循环都重新创建，确保基于最新原始日志）
              cp ./build-image.log ./build-image.tmp.log
              
              # 步骤2：将磁盘状态信息追加到临时副本中，不改动原始文件
              echo \"--- Log Snapshot at \$TIMESTAMP (Avail: \${AVAIL}KB) ---\" >> ./build-image.tmp.log
              echo -e \"\\n===== Disk Status at \${TIMESTAMP} =====\" >> ./build-image.tmp.log
              df -h >> ./build-image.tmp.log
              
              # 步骤3：使用临时副本更新 Gist，原始日志保持不变
              # 使用 edit 命令覆盖原有 Gist 内容，不产生新文件
              gh gist edit $GIST_ID ./build-image.tmp.log > /dev/null 2>&1 && echo \"Gist backup successful at \$TIMESTAMP\"
              
              # 磁盘预警：少于 2GB 则强制退出前最后同步一次
              if [ \"\$AVAIL\" -lt 2097152 ]; then
                echo \"DISK CRITICAL! Last sync...\"
                # 预警信息：同样先追加到原始日志，再更新临时副本
                echo \"DISK CRITICAL! Last sync at \$TIMESTAMP\" >> ./build-image.log
                # 复制最新原始日志到临时副本，追加磁盘详情到临时副本
                cp ./build-image.log ./build-image.tmp.log
                du -sh /* 2>/dev/null | sort -rh | head -n 5 >> ./build-image.tmp.log
                # 用最终临时副本更新 Gist
                gh gist edit $GIST_ID ./build-image.tmp.log
                exit 1
              fi
              
              # 可选：清理临时副本（如需节省磁盘空间，每次循环后删除）
              rm -f ./build-image.tmp.log
          done
          " &
          echo $! > watchdog.pid
        shell: bash
      
      - name: Prepare /mnt directory
        run: |
          # 将 /mnt 的所有权更改为当前执行用户
          sudo chown -R $USER:$USER /mnt
          # 显示原来的mnt内容
          echo "=== 原始 /mnt 目录内容 ==="
          ls -l /mnt
          # 创建工作目录
          mkdir -p /mnt/stage
          # 显示修改后的mnt内容
          echo "=== 修改后 /mnt 目录内容 ==="
          ls -l /mnt
          # 创建缓存目录的符号链接
          ln -s /mnt/stage cache
          # 显示当前工作目录内容
          echo "=== 当前工作目录内容 ==="
          ls -l ./

      # 步骤4：执行编译脚本生成镜像
      - name: Build OrangePi Image
        run: |
          # 删除冲突的补丁
          rm -rf ./patch/kernel/archive/rockchip64-6.18/board-helios64-remove-pcie-ep-gpios.patch
          rm -rf ./patch/kernel/archive/rockchip64-6.18/rk3576-0002-mmc-dw_mmc-rockchip-add-v2-tuning-support.patch
          # 使用自定板配置，走hack隐藏
          mv "./config/boards" "./config/boards.bak"
          ls -l ./config
          ./compile.sh build \
            BOARD=${{ github.event.inputs.board }} \
            BRANCH=${{ github.event.inputs.kernel }} \
            BUILD_DESKTOP=yes \
            BUILD_MINIMAL=no \
            DESKTOP_APPGROUPS_SELECTED='browsers chat desktop_tools editors email internet multimedia office programming remote_desktop' \
            DESKTOP_ENVIRONMENT=${{ github.event.inputs.desktop_env }} \
            DESKTOP_ENVIRONMENT_CONFIG_NAME=config_base \
            KERNEL_CONFIGURE=no \
            RELEASE=${{ github.event.inputs.release }} \
            ENABLE_EXTENSIONS='override-kernel bcmdhd-install preset-firstrun' \
            2>&1 | tee >(sed 's/\x1B\[[0-9;]*[a-zA-Z]//g' > build-image.log)
            mv "./config/boards.bak" "./config/boards"
        env:
          VERBOSE: 1
          USE_TMPFS: no

      - name: List Products & Final Disk Check
        if: always()
        run: |
          echo "=== 输出目录结构 ==="
          ls -la ./output/ || true
          echo "=== 镜像文件列表 ==="
          ls -la ./output/images/ || true
          echo -e "\n=== 最终磁盘使用率 ==="
          df -h
        shell: bash

      - name: Package Image Zip
        run: |
          cd ./output/images/
          echo "=== 开始打包压缩 ==="
          
          IMG_FILE=$(ls *.img 2>/dev/null | head -1)
          if [ -z "$IMG_FILE" ]; then
            echo "错误: 未找到 .img 文件"
            exit 1
          fi
          
          BASE_NAME="${IMG_FILE%.img}"
          echo "基础文件名: $BASE_NAME"
          
          echo "=== 待打包文件 ==="
          ls -lh "${BASE_NAME}.img" "${BASE_NAME}.img.sha" "${BASE_NAME}.img.txt"
          
          echo "正在打包压缩为 ${BASE_NAME}.zip ..."
          zip -9 "${BASE_NAME}.zip" \
            "${BASE_NAME}.img" \
            "${BASE_NAME}.img.sha" \
            "${BASE_NAME}.img.txt"
          
          echo "压缩完成"
          
          echo "=== 压缩包信息 ==="
          ls -lh "${BASE_NAME}.zip"
          ZIP_SIZE=$(stat -f%z "${BASE_NAME}.zip" 2>/dev/null || stat -c%s "${BASE_NAME}.zip")
          ZIP_SIZE_GB=$(echo "scale=2; $ZIP_SIZE / 1024 / 1024 / 1024" | bc)
          echo "压缩包大小: ${ZIP_SIZE_GB} GB"
          
          if [ $ZIP_SIZE -gt 2147483648 ]; then
            echo "警告: 压缩包大小 ${ZIP_SIZE_GB}GB 超过 GitHub Release 2GB 限制"
            exit 1
          else
            echo "压缩包大小符合 GitHub Release 限制"
          fi
          
          echo "生成校验和..."
          sha256sum "${BASE_NAME}.zip" > "${BASE_NAME}.zip.sha256"
          
          echo "=== 最终文件列表 ==="
          ls -lh *.zip *.sha256
        shell: bash
      
      - name: Upload Image Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orangepi5-max-gnome-image-${{ github.run_id }}
          path: |
            ./output/images/*.zip
            ./output/images/*.zip.sha256
          retention-days: 90
          if-no-files-found: warn
      
      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          overwrite: true
          draft: false
          prerelease: false
          body: |
            ## OrangePi 5 Max Gnome 桌面镜像
            
            ### 下载说明
            下载 .zip 文件后解压
            
            Windows: 右键解压
            Linux/macOS:
            ```bash
            unzip Armbian-unofficial_*.zip
            ```
            
            ### 压缩包内容
            - *.img 系统镜像文件
            - *.img.sha SHA1 校验和
            - *.img.txt 构建信息
            
            ### 验证文件完整性
            ```bash
            sha256sum -c *.zip.sha256
            ```
          files: |
            ./output/images/*.zip
            ./output/images/*.zip.sha256
          
      # 4. 停止并上传最后状态
      - name: Stop Watchdog & Final Gist Sync
        if: always()
        run: |
          [ -f watchdog.pid ] && kill $(cat watchdog.pid) || true
          if [ -n "$GIST_ID" ]; then
            echo "Performing final Gist sync..."
            gh gist edit $GIST_ID ./build-image.log || true
            echo "Final Gist Link: gist.github.com"
          fi
        shell: bash

      - name: Upload Logs to Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-final
          path: ./build-image.log

      
