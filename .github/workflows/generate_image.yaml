name: Generate OrangePi5-Max Gnome Image

on:
  workflow_dispatch:
    inputs:
      board:
        required: true
        default: 'orangepi5-max'
        type: string
      kernel:
        required: true
        default: 'edge'
        type: string
      release:
        required: true
        default: 'plucky'
        type: string
      desktop_env:
        required: true
        default: 'gnome'
        type: string

jobs:
  build-and-upload-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      # 1. 深度清理磁盘
      - name: Deep Disk Cleanup
        run: |
          sudo rm -rf /home/runner/actions-runner/cached/_diag/* /home/runner/_diag/*
          sudo docker system prune -a -f --volumes
          sudo apt clean && sudo apt autoremove -y --purge
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/miniconda /usr/local/go /usr/share/maven
          sudo rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/* /var/log/*.log
          sudo sync
          df -h
        shell: bash

      # 2. 升级gh CLI到最新版（确保artifact命令可用）
      - name: Upgrade GitHub CLI to Latest Version
        run: |
          echo "当前gh版本：$(gh --version || echo '未安装')"
          type -p curl >/dev/null || (sudo apt update && sudo apt install curl -y)
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg \
            && sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg \
            && echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update -y
          sudo apt install gh -y
          echo "升级后gh版本：$(gh --version)"
          gh artifact --help >/dev/null 2>&1 && echo "✅ artifact命令可用" || { echo "❌ artifact命令仍不可用"; exit 1; }
        shell: bash

      # 3. 检出代码
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 4. 安装依赖
      - name: Install Build Dependencies
        run: |
          sudo apt update -y
          sudo apt install -y --no-install-recommends \
            git build-essential curl wget unzip zip qemu-user-static binfmt-support python3 python3-pip \
            rsync bc bison flex libssl-dev parted dosfstools squashfs-tools imagemagick jq zstd
        shell: bash

      # 5. 初始化日志 + 启动【48分钟周期】备份+上传一体化后台进程
      - name: Init Logs & Start 48min Backup-Upload Daemon
        run: |
          mkdir -p ./logs
          touch ./build-image.log
          
          # 初始化并上传首次日志（带初始磁盘信息）
          INIT_TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          INIT_COPY="./logs/image-build-log-INIT-${INIT_TIMESTAMP}.log"
          cp ./build-image.log "${INIT_COPY}"
          echo "===== Initial Disk Status at ${INIT_TIMESTAMP} =====" >> "${INIT_COPY}"
          df -h >> "${INIT_COPY}"
          # 上传初始化日志
          gh artifact upload "image-log-${{ github.run_id }}-INIT-${INIT_TIMESTAMP}" \
            --file "${INIT_COPY}" \
            --repo "${{ github.repository }}" \
            --retention-days 90
          
          # 启动后台进程：每48分钟（2880秒）执行一次 备份+上传
          bash -c '
          REPO="${{ github.repository }}"
          RUN_ID="${{ github.run_id }}"
          while true
          do
              # 等待48分钟
              sleep 2880
              
              # 步骤1：生成带磁盘信息的日志副本
              TIMESTAMP=$(date +%Y%m%d-%H%M%S)
              TEMP_COPY="./logs/image-build-log-TEMP-${TIMESTAMP}.log"
              cp ./build-image.log "${TEMP_COPY}"
              echo -e "\n===== Disk Status at ${TIMESTAMP} =====" >> "${TEMP_COPY}"
              df -h >> "${TEMP_COPY}"
              
              # 步骤2：立即上传该副本（无需目录中转）
              gh artifact upload "image-log-${RUN_ID}-${TIMESTAMP}" \
                --file "${TEMP_COPY}" \
                --repo "${REPO}" \
                --retention-days 90
              
              # 可选：删除已上传的副本，节省磁盘空间
              rm -f "${TEMP_COPY}"
          done
          ' &
          echo "BACKUP_UPLOAD_PID=$!" >> "$GITHUB_ENV"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash

      # 6. 编译脚本权限
      - name: Make compile.sh Executable
        run: chmod +x ./compile.sh
        shell: bash

      # 7. 执行镜像编译
      - name: Build OrangePi Image
        id: build
        run: |
          ./compile.sh build \
            BOARD=${{ github.event.inputs.board }} \
            BRANCH=${{ github.event.inputs.kernel }} \
            BUILD_DESKTOP=yes \
            BUILD_MINIMAL=no \
            DESKTOP_APPGROUPS_SELECTED='browsers desktop_tools editors multimedia' \
            DESKTOP_ENVIRONMENT=${{ github.event.inputs.desktop_env }} \
            DESKTOP_ENVIRONMENT_CONFIG_NAME=config_base \
            KERNEL_CONFIGURE=no \
            RELEASE=${{ github.event.inputs.release }} \
            ENABLE_EXTENSIONS=override-kernel \
            COMPRESS_OUTPUT=zstd \
            NO_BTF=yes \
            CLEAN_LEVEL=full \
            2>&1 | tee -a ./build-image.log
        continue-on-error: true
        shell: bash

      # 8. 终止后台进程 + 上传最终日志
      - name: Stop Daemon & Upload Final Log
        if: always()
        run: |
          # 终止48分钟周期的后台进程
          [ -n "${{ env.BACKUP_UPLOAD_PID }}" ] && kill ${{ env.BACKUP_UPLOAD_PID }} 2>/dev/null || true
          
          # 生成并上传最终日志（带结束时磁盘信息）
          FINAL_TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          FINAL_COPY="./logs/image-build-log-FINAL-${FINAL_TIMESTAMP}.log"
          cp ./build-image.log "${FINAL_COPY}"
          echo -e "\n===== Final Disk Status at ${FINAL_TIMESTAMP} =====" >> "${FINAL_COPY}"
          df -h >> "${FINAL_COPY}"
          
          gh artifact upload "image-log-${{ github.run_id }}-FINAL-${FINAL_TIMESTAMP}" \
            --file "${FINAL_COPY}" \
            --repo "${{ github.repository }}" \
            --retention-days 90
          # 上传纯净编译日志（无磁盘信息）
          gh artifact upload "image-log-${{ github.run_id }}-PURE" \
            --file ./build-image.log \
            --repo "${{ github.repository }}" \
            --retention-days 90
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash

      # 9. 保留原有：列出镜像文件
      - name: List Generated Image Files
        if: always()
        run: |
          echo "=== 列出output目录结构 ==="
          ls -la ./output/ || true
          echo "=== 列出images目录文件 ==="
          ls -la ./output/images/ || true
        shell: bash

      # 10. 保留原有：上传镜像产物
      - name: Upload Image Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orangepi5-max-gnome-image-${{ github.run_id }}
          path: |
            ./output/images/*.img
            ./output/images/*.img.xz
            ./output/images/*.img.zip
            ./output/images/*.sha256sum
            ./output/images/*.md5sum
          retention-days: 90
          if-no-files-found: error

      # 11. 最终清理
      - name: Final Cleanup
        if: always()
        run: |
          sudo rm -rf ./build ./output ./logs ./build-image.log
          sudo sync
        shell: bash
