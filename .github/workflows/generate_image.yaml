name: Generate OrangePi5-Max Gnome Image

on:
  workflow_dispatch:
    inputs:
      board:
        required: true
        default: 'orangepi5-max'
        type: string
      kernel:
        required: true
        default: 'edge'
        type: string
      release:
        required: true
        default: 'plucky'
        type: string
      desktop_env:
        required: true
        default: 'gnome'
        type: string

jobs:
  build-and-upload-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      # 1. 轻量磁盘清理
      - name: Light Disk Cleanup
        run: |
          sudo rm -rf /home/runner/actions-runner/cached/_diag/* /home/runner/_diag/*
          sudo docker system prune -a -f --volumes >/dev/null 2>&1
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/miniconda /usr/local/go /usr/share/maven
          sudo rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/* /var/log/*.log
          sudo sync
          df -h
        shell: bash
        timeout-minutes: 2

      # 2. 安装GH CLI（确保上传命令可用）
      - name: Install GitHub CLI
        run: |
          # 用二进制包快速安装
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update -y >/dev/null 2>&1
          sudo apt install gh -y >/dev/null 2>&1
          # 验证并授权
          gh --version && gh auth setup-git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        timeout-minutes: 3

      # 3. 检出代码
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        timeout-minutes: 1

      # 4. 安装构建依赖
      - name: Install Build Dependencies
        run: |
          sudo apt update -y >/dev/null 2>&1
          sudo apt install -y --no-install-recommends \
            git build-essential curl wget unzip zip qemu-user-static binfmt-support python3 python3-pip \
            rsync bc bison flex libssl-dev parted dosfstools squashfs-tools imagemagick jq zstd
        shell: bash
        timeout-minutes: 5

      # 5. 初始化日志并上传首次日志
      - name: Init Log & Upload Initial Log
        run: |
          mkdir -p ./logs
          touch ./build-image.log
          
          # 生成初始日志（带磁盘信息）
          INIT_TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          INIT_LOG="./logs/image-build-log-INIT-${INIT_TIMESTAMP}.log"
          cp ./build-image.log "${INIT_LOG}"
          echo "===== Initial Disk Status at ${INIT_TIMESTAMP} =====" >> "${INIT_LOG}"
          df -h >> "${INIT_LOG}"
          
          # 立即上传初始日志
          gh artifact upload "image-log-${{ github.run_id }}-INIT-${INIT_TIMESTAMP}" \
            --file "${INIT_LOG}" --repo "${{ github.repository }}" --retention-days 90
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash

      # 6. 启动48分钟周期：生成日志+自动上传（核心修复）
      - name: Start 48min Log Backup & Upload Daemon
        run: |
          bash -c '
          RUN_ID="${{ github.run_id }}"
          REPO="${{ github.repository }}"
          while true
          do
              # 等待48分钟
              sleep 2880
              
              # 步骤1：生成带磁盘信息的日志
              TIMESTAMP=$(date +%Y%m%d-%H%M%S)
              TEMP_LOG="./logs/image-build-log-TEMP-${TIMESTAMP}.log"
              cp ./build-image.log "${TEMP_LOG}"
              echo -e "\n===== Disk Status at ${TIMESTAMP} =====" >> "${TEMP_LOG}"
              df -h >> "${TEMP_LOG}"
              
              # 步骤2：立即上传该日志（无需依赖外部步骤）
              gh artifact upload "image-log-${RUN_ID}-${TIMESTAMP}" \
                --file "${TEMP_LOG}" --repo "${REPO}" --retention-days 90
              
              # （可选）删除已上传日志，，节省空间
              rm -f "${TEMP_LOG}"
          done
          ' &
          echo "BACKUP_UPLOAD_PID=$!" >> "$GITHUB_ENV"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash

      # 7. 赋予编译脚本执行权限
      - name: Make compile.sh Executable
        run: chmod +x ./compile.sh
        shell: bash

      # 8. 执行镜像编译
      - name: Build OrangePi Image
        id: build
        run: |
          ./compile.sh build \
            BOARD=${{ github.event.inputs.board }} \
            BRANCH=${{ github.event.inputs.kernel }} \
            BUILD_DESKTOP=yes \
            BUILD_MINIMAL=no \
            DESKTOP_APPGROUPS_SELECTED='browsers desktop_tools editors multimedia' \
            DESKTOP_ENVIRONMENT=${{ github.event.inputs.desktop_env }} \
            DESKTOP_ENVIRONMENT_CONFIG_NAME=config_base \
            KERNEL_CONFIGURE=no \
            RELEASE=${{ github.event.inputs.release }} \
            ENABLE_EXTENSIONS=override-kernel \
            COMPRESS_OUTPUT=zstd \
            NO_BTF=yes \
            CLEAN_LEVEL=full \
            2>&1 | tee -a ./build-image.log
        continue-on-error: true
        shell: bash

      # 9. 终止后台进程 + 上传最终日志
      - name: Stop Daemon & Upload Final Log
        if: always()
        run: |
          [ -n "${{ env.BACKUP_UPLOAD_PID }}" ] && kill ${{ env.BACKUP_UPLOAD_PID }} 2>/dev/null || true
          
          # 生成最终日志
          FINAL_TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          FINAL_LOG="./logs/image-build-log-FINAL-${FINAL_TIMESTAMP}.log"
          cp ./build-image.log "${FINAL_LOG}"
          echo -e "\n===== Final Disk Status at ${FINAL_TIMESTAMP} =====" >> "${FINAL_LOG}"
          df -h >> "${FINAL_LOG}"
          
          # 上传最终日志+纯净日志
          gh artifact upload "image-log-${{ github.run_id }}-FINAL-${FINAL_TIMESTAMP}" \
            --file "${FINAL_LOG}" --repo "${{ github.repository }}" --retention-days 90
          gh artifact upload "image-log-${{ github.run_id }}-PURE" \
            --file ./build-image.log --repo "${{ github.repository }}" --retention-days 90
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash

      # 10. 列出镜像文件
      - name: List Generated Image Files
        if: always()
        run: |
          echo "=== 列出output目录结构 ==="
          ls -la ./output/ || true
          echo "=== 列出images目录文件 ==="
          ls -la ./output/images/ || true
        shell: bash

      # 11. 上传镜像产物
      - name: Upload Image Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orangepi5-max-gnome-image-${{ github.run_id }}
          path: |
            ./output/images/*.img
            ./output/images/*.img.xz
            ./output/images/*.img.zip
            ./output/images/*.sha256sum
            ./output/images/*.md5sum
          retention-days: 90
          if-no-files-found: error

      # 12. 最终清理
      - name: Final Cleanup
        if: always()
        run: |
          sudo rm -rf ./build ./output ./logs ./build-image.log
          sudo sync
        shell: bash
