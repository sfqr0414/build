name: Generate OrangePi5-Max Gnome Image

on:
  workflow_dispatch:
    inputs:
      board:
        description: '目标开发板型号'
        required: true
        default: 'orangepi5-max'
        type: string
      kernel:
        description: '内核版本'
        required: true
        default: 'edge'
        type: string
      release:
        description: '发行版'
        required: true
        default: 'plucky'
        type: string
      desktop_env:
        description: '桌面环境'
        required: true
        default: 'gnome'
        type: string

jobs:
  build-and-upload-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Get more disk space
        run: |
          sudo rm -rf /home/runner/actions-runner/cached/_diag/* || true
          sudo rm -rf /home/runner/_diag/* || true
          sudo docker system prune -a -f || true
          sudo apt-get clean
          sudo apt-get autoremove -y --purge
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          sudo rm -rf /var/lib/apt/lists/* || true
          sudo rm -rf ${{ github.workspace }}/build/* ${{ github.workspace }}/images/* || true
          sudo rm -rf /tmp/* /var/tmp/* || true
          df -h

      # 2. 检出代码仓库
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 3. 安装编译依赖
      - name: Install Build Dependencies
        run: |
          sudo apt update -y
          sudo apt install -y --no-install-recommends \
            git build-essential curl wget unzip zip qemu-user-static binfmt-support python3 python3-pip \
            rsync bc bison flex libssl-dev parted dosfstools squashfs-tools imagemagick jq zstd

      # 4. 启动后台定时脚本：不修改源日志，仅操作临时副本
      - name: Start Background Log Backup & Upload Script
        run: |
          # 创建日志目录
          mkdir -p ./logs
          # 初始化主日志（仅用于编译输出，后续不修改）
          touch ./build-image.log
          # 初始化时单独生成带初始磁盘信息的副本（不改动源日志）
          INIT_TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          INIT_COPY="./logs/image-build-log-INIT-${INIT_TIMESTAMP}.log"
          cp ./build-image.log ${INIT_COPY}
          echo "===== Initial Disk Status at ${INIT_TIMESTAMP} =====" >> ${INIT_COPY}
          df -h >> ${INIT_COPY}
          # 上传初始副本（可选，便于确认初始状态）
          export GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}"
          gh artifact upload "image-log-${{ github.run_id }}-INIT-${INIT_TIMESTAMP}" \
            --file ${INIT_COPY} \
            --repo ${{ github.repository }} \
            --retention-days 90

          # 编写后台脚本：操作临时副本，不碰源日志
          cat > ./log-backup-upload.sh << EOF
          #!/bin/bash
          export GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}"
          export RUN_ID="${{ github.run_id }}"
          export REPO="${{ github.repository }}"

          while true
          do
              # 等待48分钟（2880秒）
              sleep 2880

              # 生成时间戳
              TIMESTAMP=\$(date +%Y%m%d-%H%M%S)
              # 步骤1：复制源日志到临时副本（核心：不修改源文件）
              TEMP_COPY="./logs/image-build-log-TEMP-\${TIMESTAMP}.log"
              cp ./build-image.log \${TEMP_COPY}
              # 步骤2：仅往临时副本追加磁盘信息
              echo -e "\\n===== Disk Status at \${TIMESTAMP} =====" >> \${TEMP_COPY}
              df -h >> \${TEMP_COPY}
              # 步骤3：上传临时副本（带磁盘信息）
              gh artifact upload "image-log-\${RUN_ID}-\${TIMESTAMP}" \
                --file \${TEMP_COPY} \
                --repo \${REPO} \
                --retention-days 90

              # 记录上传信息到临时副本（可选），不影响源日志
              echo "===== Uploaded as artifact: image-log-\${RUN_ID}-\${TIMESTAMP} =====" >> \${TEMP_COPY}
              # 删除临时副本（可选，节省空间）
              rm -f \${TEMP_COPY}
          done
          EOF

          chmod +x ./log-backup-upload.sh
          ./log-backup-upload.sh &
          echo "LOG_BACKUP_PID=$!" >> $GITHUB_ENV

      # 5. 赋予编译脚本执行权限
      - name: Make compile.sh Executable
        run: chmod +x ./compile.sh

      # 6. 执行镜像编译，日志仅写入源文件 build-image.log
      - name: Build OrangePi Image
        id: build
        run: |
          ./compile.sh build \
            BOARD=${{ github.event.inputs.board }} \
            BRANCH=${{ github.event.inputs.kernel }} \
            BUILD_DESKTOP=yes \
            BUILD_MINIMAL=no \
            DESKTOP_APPGROUPS_SELECTED='browsers desktop_tools editors multimedia' \
            DESKTOP_ENVIRONMENT=${{ github.event.inputs.desktop_env }} \
            DESKTOP_ENVIRONMENT_CONFIG_NAME=config_base \
            KERNEL_CONFIGURE=no \
            RELEASE=${{ github.event.inputs.release }} \
            ENABLE_EXTENSIONS=override-kernel \
            COMPRESS_OUTPUT=zstd \
            NO_BTF=yes \
            CLEAN_LEVEL=full \
            2>&1 | tee -a ./build-image.log
        continue-on-error: true

      # 7. 终止后台脚本+生成最终带磁盘信息的副本并上传
      - name: Stop Background Script & Upload Final Log
        if: always()
        run: |
          kill ${{ env.LOG_BACKUP_PID }} || true

          # 生成最终带磁盘信息的副本，不修改源日志
          FINAL_TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          FINAL_COPY="./logs/image-build-log-FINAL-${FINAL_TIMESTAMP}.log"
          cp ./build-image.log ${FINAL_COPY}
          # 仅往最终副本追加磁盘信息
          echo -e "\\n===== Final Disk Status at ${FINAL_TIMESTAMP} =====" >> ${FINAL_COPY}
          df -h >> ${FINAL_COPY}

          # 上传最终副本
          export GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}"
          gh artifact upload "image-log-${{ github.run_id }}-FINAL-${FINAL_TIMESTAMP}" \
            --file ${FINAL_COPY} \
            --repo ${{ github.repository }} \
            --retention-days 90

          # 可选：上传纯净的源日志（无磁盘信息）
          gh artifact upload "image-log-${{ github.run_id }}-PURE" \
            --file ./build-image.log \
            --repo ${{ github.repository }} \
            --retention-days 90

      # ========== 保留你指定的 列文件 + 上传镜像 逻辑 ==========
      # 步骤5：列出生成的镜像文件（便于确认路径，调试用）
      - name: List Generated Image Files
        if: always()
        run: |
          echo "=== 列出output目录结构 ==="
          ls -la ./output/ || true
          echo "=== 列出images目录文件 ==="
          ls -la ./output/images/ || true

      # 步骤6：上传镜像文件到Artifacts
      - name: Upload Image Artifacts
        uses: actions/upload-artifact@v4
        with:
          # Artifact名称（便于识别）
          name: orangepi5-max-gnome-image-${{ github.run_id }}
          # 镜像文件路径（根据compile.sh实际输出路径调整！）
          # 常见路径：output/images/ 下的.img/.xz/.zip/.sha256sum等
          path: |
            ./output/images/*.img
            ./output/images/*.img.xz
            ./output/images/*.img.zip
            ./output/images/*.sha256sum
            ./output/images/*.md5sum
          # 产物保留天数（默认90天，可根据需求调整）
          retention-days: 90
          # 启用并行上传（加快大文件上传速度）
          if-no-files-found: error  # 无文件时触发错误（避免漏传）

      # 8. 最终清理磁盘空间
      - name: Final Cleanup
        if: always()
        run: |
          sudo rm -rf ./build ./output ./logs ./build-image.log
          sudo sync && echo 3 > /proc/sys/vm/drop_caches
