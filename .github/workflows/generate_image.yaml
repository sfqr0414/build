name: Generate OrangePi5-Max Gnome Image

on:
  workflow_dispatch:
    inputs:
      board:
        required: true
        default: 'orangepi5-max'
        type: string
      kernel:
        required: true
        default: 'edge'
        type: string
      release:
        required: true
        default: 'plucky'
        type: string
      desktop_env:
        required: true
        default: 'gnome'
        type: string

jobs:
  build-and-upload-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      # 1. 深度清理磁盘
      - name: Deep Disk Cleanup
        run: |
          sudo rm -rf /home/runner/actions-runner/cached/_diag/* /home/runner/_diag/*
          sudo docker system prune -a -f --volumes
          sudo apt clean && sudo apt autoremove -y --purge
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/miniconda /usr/local/go /usr/share/maven
          sudo rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/* /var/log/*.log
          sudo sync
          df -h > ./disk-initial.log
        shell: bash

      # 2. 检出代码
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 3. 安装依赖
      - name: Install Build Dependencies
        run: |
          sudo apt update -y
          sudo apt install -y --no-install-recommends \
            git build-essential curl wget unzip zip qemu-user-static binfmt-support python3 python3-pip \
            rsync bc bison flex libssl-dev parted dosfstools squashfs-tools imagemagick jq zstd
        shell: bash

      # 4. 初始化日志+后台备份（修复kill和gh命令）
      - name: Init Logs & Start Background Backup
        run: |
          mkdir -p ./logs ./logs/to-upload
          touch ./build-image.log
          
          INIT_TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          INIT_COPY="./logs/image-build-log-INIT-${INIT_TIMESTAMP}.log"
          cp ./build-image.log "${INIT_COPY}"
          echo "===== Initial Disk Status at ${INIT_TIMESTAMP} =====" >> "${INIT_COPY}"
          cat ./disk-initial.log >> "${INIT_COPY}"
          mv "${INIT_COPY}" ./logs/to-upload/
          
          # 后台备份逻辑
          bash -c '
          while true
          do
              sleep 2880
              TIMESTAMP=$(date +%Y%m%d-%H%M%S)
              TEMP_COPY="./logs/image-build-log-TEMP-${TIMESTAMP}.log"
              cp ./build-image.log "${TEMP_COPY}"
              echo -e "\n===== Disk Status at ${TIMESTAMP} =====" >> "${TEMP_COPY}"
              df -h >> "${TEMP_COPY}"
              mv "${TEMP_COPY}" ./logs/to-upload/
          done
          ' &
          echo "BACKUP_PID=$!" >> "$GITHUB_ENV"
        shell: bash

      # 5. 后台上传（核心修复：用gh artifact upload替代gh run upload）
      - name: Start Background Log Upload
        run: |
          # 后台上传逻辑（修复gh命令参数）
          bash -c '
          REPO="${{ github.repository }}"
          while true
          do
              if [ -n "$(ls -A ./logs/to-upload/*.log 2>/dev/null)" ]; then
                  for LOG_FILE in ./logs/to-upload/*.log; do
                      FILE_NAME=$(basename "${LOG_FILE}")
                      TIMESTAMP=$(echo "${FILE_NAME}" | sed -n "s/.*-\([0-9]\{8\}-[0-9]\{6\}\)\.log/\1/p")
                      [ -z "${TIMESTAMP}" ] && TIMESTAMP=$(date +%Y%m%d-%H%M%S)
                      ARTIFACT_NAME="image-log-${{ github.run_id }}-${TIMESTAMP}"
                      # 正确的gh artifact上传命令
                      gh artifact upload "${ARTIFACT_NAME}" --file "${LOG_FILE}" --repo "${REPO}" --retention-days 90
                      rm -f "${LOG_FILE}"
                  done
              fi
              sleep 60
          done
          ' &
          echo "UPLOAD_PID=$!" >> "$GITHUB_ENV"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash

      # 6. 编译脚本权限
      - name: Make compile.sh Executable
        run: chmod +x ./compile.sh
        shell: bash

      # 7. 编译镜像
      - name: Build OrangePi Image
        id: build
        run: |
          ./compile.sh build \
            BOARD=${{ github.event.inputs.board }} \
            BRANCH=${{ github.event.inputs.kernel }} \
            BUILD_DESKTOP=yes \
            BUILD_MINIMAL=no \
            DESKTOP_APPGROUPS_SELECTED='browsers desktop_tools editors multimedia' \
            DESKTOP_ENVIRONMENT=${{ github.event.inputs.desktop_env }} \
            DESKTOP_ENVIRONMENT_CONFIG_NAME=config_base \
            KERNEL_CONFIGURE=no \
            RELEASE=${{ github.event.inputs.release }} \
            ENABLE_EXTENSIONS=override-kernel \
            COMPRESS_OUTPUT=zstd \
            NO_BTF=yes \
            CLEAN_LEVEL=full \
            2>&1 | tee -a ./build-image.log
        continue-on-error: true
        shell: bash

      # 8. 终止后台进程+上传最终日志（修复kill命令，增加PID判断）
      - name: Stop Background Processes & Upload Final Log
        if: always()
        run: |
          # 修复kill：仅当PID存在时才杀死
          [ -n "${{ env.BACKUP_PID }}" ] && kill ${{ env.BACKUP_PID }} 2>/dev/null || true
          [ -n "${{ env.UPLOAD_PID }}" ] && kill ${{ env.UPLOAD_PID }} 2>/dev/null || true
          
          FINAL_TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          FINAL_COPY="./logs/image-build-log-FINAL-${FINAL_TIMESTAMP}.log"
          cp ./build-image.log "${FINAL_COPY}"
          echo -e "\n===== Final Disk Status at ${FINAL_TIMESTAMP} =====" >> "${FINAL_COPY}"
          df -h >> "${FINAL_COPY}"
          
          # 正确上传最终日志
          gh artifact upload "image-log-${{ github.run_id }}-FINAL-${FINAL_TIMESTAMP}" \
            --file "${FINAL_COPY}" \
            --repo ${{ github.repository }} \
            --retention-days 90
          gh artifact upload "image-log-${{ github.run_id }}-PURE" \
            --file ./build-image.log \
            --repo ${{ github.repository }} \
            --retention-days 90
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash

      # 9. 列出镜像文件
      - name: List Generated Image Files
        if: always()
        run: |
          echo "=== 列出output目录结构 ==="
          ls -la ./output/ || true
          echo "=== 列出images目录文件 ==="
          ls -la ./output/images/ || true
        shell: bash

      # 10. 上传镜像产物
      - name: Upload Image Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orangepi5-max-gnome-image-${{ github.run_id }}
          path: |
            ./output/images/*.img
            ./output/images/*.img.xz
            ./output/images/*.img.zip
            ./output/images/*.sha256sum
            ./output/images/*.md5sum
          retention-days: 90
          if-no-files-found: error

      # 11. 最终清理
      - name: Final Cleanup
        if: always()
        run: |
          sudo rm -rf ./build ./output ./logs ./build-image.log ./disk-initial.log
          sudo sync
        shell: bash
