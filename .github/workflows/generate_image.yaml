name: Generate OrangePi5-Max Gnome Image

on:
  workflow_dispatch:
    inputs:
      board:
        description: '目标开发板型号'
        required: true
        default: 'orangepi5-max'
        type: string
      kernel:
        description: '内核版本'
        required: true
        default: 'edge'
        type: string
      release:
        description: '发行版'
        required: true
        default: 'plucky'
        type: string
      desktop_env:
        description: '桌面环境'
        required: true
        default: 'gnome'
        type: string

jobs:
  build-and-upload-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      # 1. 深度清理磁盘（移除权限敏感的 drop_caches 操作）
      - name: Deep Disk Cleanup
        run: |
          sudo rm -rf /home/runner/actions-runner/cached/_diag/* /home/runner/_diag/*
          sudo docker system prune -a -f --volumes
          sudo apt clean && sudo apt autoremove -y --purge
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/miniconda /usr/local/go /usr/share/maven
          sudo rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/* /var/log/*.log
          sudo sync  # 替换 drop_caches，安全释放页缓存
          df -h

      # 2. 检出代码仓库
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 3. 安装编译依赖
      - name: Install Build Dependencies
        run: |
          sudo apt update -y
          sudo apt install -y --no-install-recommends \
            git build-essential curl wget unzip zip qemu-user-static binfmt-support python3 python3-pip \
            rsync bc bison flex libssl-dev parted dosfstools squashfs-tools imagemagick jq zstd

      # 4. 启动后台脚本：仅备份日志（不使用 gh），标记待上传文件
      - name: Start Background Log Backup Script
        run: |
          # 创建日志目录和待上传标记目录
          mkdir -p ./logs ./logs/to-upload
          # 初始化主日志（仅存编译输出）
          touch ./build-image.log
          # 初始化带磁盘信息的副本并标记待上传
          INIT_TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          INIT_COPY="./logs/image-build-log-INIT-${INIT_TIMESTAMP}.log"
          cp ./build-image.log ${INIT_COPY}
          echo "===== Initial Disk Status at ${INIT_TIMESTAMP} =====" >> ${INIT_COPY}
          df -h >> ${INIT_COPY}
          mv ${INIT_COPY} ./logs/to-upload/  # 标记为待上传

          # 后台脚本：每48分钟备份日志到待上传目录（无 gh 依赖）
          cat > ./log-backup.sh << EOF
          #!/bin/bash
          while true
          do
              sleep 2880  # 48分钟
              TIMESTAMP=\$(date +%Y%m%d-%H%M%S)
              # 复制源日志生成临时副本
              TEMP_COPY="./logs/image-build-log-TEMP-\${TIMESTAMP}.log"
              cp ./build-image.log \${TEMP_COPY}
              # 仅往副本追加磁盘信息
              echo -e "\\n===== Disk Status at \${TIMESTAMP} =====" >> \${TEMP_COPY}
              df -h >> \${TEMP_COPY}
              # 移动到待上传目录，触发上传步骤
              mv \${TEMP_COPY} ./logs/to-upload/
          done
          EOF

          chmod +x ./log-backup.sh
          ./log-backup.sh &
          echo "LOG_BACKUP_PID=$!" >> $GITHUB_ENV

      # 5. 并行上传待上传日志（关键：独立步骤循环检查，不阻塞编译）
      - name: Continuous Upload Pending Logs
        run: |
          while true
          do
              # 检查待上传目录是否有文件
              if [ -n "$(ls -A ./logs/to-upload/ 2>/dev/null)" ]; then
                  for LOG_FILE in ./logs/to-upload/*.log; do
                      # 提取时间戳用于 artifact 命名
                      TIMESTAMP=\$(echo \${LOG_FILE} | grep -oE '[0-9]{8}-[0-9]{6}')
                      ARTIFACT_NAME="image-log-${{ github.run_id }}-\${TIMESTAMP}"
                      # 使用官方 action 上传，无权限问题
                      echo "Uploading log artifact: \${ARTIFACT_NAME}"
                      gh run upload ${{ github.run_id }} --name "\${ARTIFACT_NAME}" --file "\${LOG_FILE}"
                      # 上传后删除，避免重复上传
                      rm -f \${LOG_FILE}
                  done
              fi
              sleep 60  # 每分钟检查一次
          done &
          echo "UPLOADER_PID=$!" >> $GITHUB_ENV
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 6. 赋予编译脚本执行权限
      - name: Make compile.sh Executable
        run: chmod +x ./compile.sh

      # 7. 执行镜像编译，日志仅写入源文件
      - name: Build OrangePi Image
        id: build
        run: |
          ./compile.sh build \
            BOARD=${{ github.event.inputs.board }} \
            BRANCH=${{ github.event.inputs.kernel }} \
            BUILD_DESKTOP=yes \
            BUILD_MINIMAL=no \
            DESKTOP_APPGROUPS_SELECTED='browsers desktop_tools editors multimedia' \
            DESKTOP_ENVIRONMENT=${{ github.event.inputs.desktop_env }} \
            DESKTOP_ENVIRONMENT_CONFIG_NAME=config_base \
            KERNEL_CONFIGURE=no \
            RELEASE=${{ github.event.inputs.release }} \
            ENABLE_EXTENSIONS=override-kernel \
            COMPRESS_OUTPUT=zstd \
            NO_BTF=yes \
            CLEAN_LEVEL=full \
            2>&1 | tee -a ./build-image.log
        continue-on-error: true

      # 8. 终止后台脚本+生成最终日志并上传
      - name: Stop Background Scripts & Upload Final Log
        if: always()
        run: |
          # 终止后台备份和上传脚本
          kill ${{ env.LOG_BACKUP_PID }} ${{ env.UPLOADER_PID }} || true
          # 生成最终带磁盘信息的副本
          FINAL_TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          FINAL_COPY="./logs/image-build-log-FINAL-${FINAL_TIMESTAMP}.log"
          cp ./build-image.log ${FINAL_COPY}
          echo -e "\\n===== Final Disk Status at ${FINAL_TIMESTAMP} =====" >> ${FINAL_COPY}
          df -h >> ${FINAL_COPY}
          # 上传最终日志
          gh run upload ${{ github.run_id }} --name "image-log-${{ github.run_id }}-FINAL-${FINAL_TIMESTAMP}" --file ${FINAL_COPY}
          # 上传纯净源日志
          gh run upload ${{ github.run_id }} --name "image-log-${{ github.run_id }}-PURE" --file ./build-image.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 9. 保留原有的列文件逻辑
      - name: List Generated Image Files
        if: always()
        run: |
          echo "=== 列出output目录结构 ==="
          ls -la ./output/ || true
          echo "=== 列出images目录文件 ==="
          ls -la ./output/images/ || true

      # 10. 保留原有的镜像上传逻辑
      - name: Upload Image Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orangepi5-max-gnome-image-${{ github.run_id }}
          path: |
            ./output/images/*.img
            ./output/images/*.img.xz
            ./output/images/*.img.zip
            ./output/images/*.sha256sum
            ./output/images/*.md5sum
          retention-days: 90
          if-no-files-found: error

      # 11. 最终清理
      - name: Final Cleanup
        if: always()
        run: |
          sudo rm -rf ./build ./output ./logs ./build-image.log
          sudo sync
