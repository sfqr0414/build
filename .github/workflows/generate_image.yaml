name: Generate OrangePi5-Max Gnome Image

on:
  workflow_dispatch:
    inputs:
      board:
        required: true
        default: 'orangepi5-max'
        type: string
      kernel:
        required: true
        default: 'edge'
        type: string
      release:
        required: true
        default: 'plucky'
        type: string
      desktop_env:
        required: true
        default: 'gnome'
        type: string

jobs:
  build-and-upload-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      # 1. 简化磁盘清理（移除apt autoremove的冗余警告）
      - name: Light Disk Cleanup
        run: |
          sudo rm -rf /home/runner/actions-runner/cached/_diag/* /home/runner/_diag/*
          sudo docker system prune -a -f --volumes >/dev/null 2>&1
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/miniconda /usr/local/go /usr/share/maven
          sudo rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/* /var/log/*.log
          sudo sync
          df -h
        shell: bash
        timeout-minutes: 2

      # 2. 检出代码（优先执行，避免依赖阻塞）
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        timeout-minutes: 1

      # 3. 安装构建依赖（提前安装jq，避免后续解析失败）
      - name: Install Build Dependencies
        run: |
          sudo apt update -y >/dev/null 2>&1
          sudo apt install -y --no-install-recommends \
            git build-essential curl wget unzip zip qemu-user-static binfmt-support python3 python3-pip \
            rsync bc bison flex libssl-dev parted dosfstools squashfs-tools imagemagick jq zstd
        shell: bash
        timeout-minutes: 5

      # 4. 初始化日志目录
      - name: Init Log Directory
        run: |
          mkdir -p ./logs ./logs/backup ./logs/uploaded
          touch ./build-image.log
          # 初始化带磁盘信息的日志
          INIT_TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          INIT_LOG="./logs/backup/image-build-log-INIT-${INIT_TIMESTAMP}.log"
          cp ./build-image.log "${INIT_LOG}"
          echo "===== Initial Disk Status at ${INIT_TIMESTAMP} =====" >> "${INIT_LOG}"
          df -h >> "${INIT_LOG}"
          # 标记为待上传
          mv "${INIT_LOG}" ./logs/
        shell: bash

      # 5. 启动48分钟周期的日志备份（仅备份，不上传）
      - name: Start 48min Log Backup Daemon
        run: |
          bash -c '
          while true
          do
              sleep 2880
              TIMESTAMP=$(date +%Y%m%d-%H%M%S)
              BACKUP_LOG="./logs/backup/image-build-log-TEMP-${TIMESTAMP}.log"
              cp ./build-image.log "${BACKUP_LOG}"
              echo -e "\n===== Disk Status at ${TIMESTAMP} =====" >> "${BACKUP_LOG}"
              df -h >> "${BACKUP_LOG}"
              mv "${BACKUP_LOG}" ./logs/
          done
          ' &
          echo "BACKUP_PID=$!" >> "$GITHUB_ENV"
        shell: bash

      # 6. 定时上传日志（使用官方action，每5分钟上传一次，避开gh命令）
      - name: Periodic Log Upload
        uses: actions/upload-artifact@v4
        with:
          name: image-log-backup-${{ github.run_id }}
          path: ./logs/*.log
          retention-days: 90
        continue-on-error: true
        # 每5分钟执行一次（利用GitHub Actions的cron模拟，实际通过循环触发）
        run: |
          while true
          do
              if [ -n "$(ls -A ./logs/*.log 2>/dev/null)" ]; then
                  # 移动已上传日志到uploaded目录
                  mv ./logs/*.log ./logs/uploaded/
              fi
              sleep 300
          done &
          echo "UPLOADER_PID=$!" >> "$GITHUB_ENV"
        shell: bash

      # 7. 赋予编译脚本执行权限
      - name: Make compile.sh Executable
        run: chmod +x ./compile.sh
        shell: bash

      # 8. 执行镜像编译
      - name: Build OrangePi Image
        id: build
        run: |
          ./compile.sh build \
            BOARD=${{ github.event.inputs.board }} \
            BRANCH=${{ github.event.inputs.kernel }} \
            BUILD_DESKTOP=yes \
            BUILD_MINIMAL=no \
            DESKTOP_APPGROUPS_SELECTED='browsers desktop_tools editors multimedia' \
            DESKTOP_ENVIRONMENT=${{ github.event.inputs.desktop_env }} \
            DESKTOP_ENVIRONMENT_CONFIG_NAME=config_base \
            KERNEL_CONFIGURE=no \
            RELEASE=${{ github.event.inputs.release }} \
            ENABLE_EXTENSIONS=override-kernel \
            COMPRESS_OUTPUT=zstd \
            NO_BTF=yes \
            CLEAN_LEVEL=full \
            2>&1 | tee -a ./build-image.log
        continue-on-error: true
        shell: bash

      # 9. 终止后台进程 + 上传最终日志
      - name: Stop Daemon & Upload Final Log
        if: always()
        run: |
          [ -n "${{ env.BACKUP_PID }}" ] && kill ${{ env.BACKUP_PID }} 2>/dev/null || true
          [ -n "${{ env.UPLOADER_PID }}" ] && kill ${{ env.UPLOADER_PID }} 2>/dev/null || true
          
          # 生成最终日志
          FINAL_TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          FINAL_LOG="./logs/image-build-log-FINAL-${FINAL_TIMESTAMP}.log"
          cp ./build-image.log "${FINAL_LOG}"
          echo -e "\n===== Final Disk Status at ${FINAL_TIMESTAMP} =====" >> "${FINAL_LOG}"
          df -h >> "${FINAL_LOG}"
          
          # 上传最终日志（官方action）
          cp ./build-image.log ./logs/image-build-log-PURE.log
        shell: bash

      # 10. 统一上传所有日志（官方action，最稳定）
      - name: Upload All Logs
        uses: actions/upload-artifact@v4
        with:
          name: image-log-all-${{ github.run_id }}
          path: |
            ./logs/*.log
            ./logs/backup/*.log
            ./logs/uploaded/*.log
          retention-days: 90

      # 11. 列出镜像文件
      - name: List Generated Image Files
        if: always()
        run: |
          echo "=== 列出output目录结构 ==="
          ls -la ./output/ || true
          echo "=== 列出images目录文件 ==="
          ls -la ./output/images/ || true
        shell: bash

      # 12. 上传镜像产物
      - name: Upload Image Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orangepi5-max-gnome-image-${{ github.run_id }}
          path: |
            ./output/images/*.img
            ./output/images/*.img.xz
            ./output/images/*.img.zip
            ./output/images/*.sha256sum
            ./output/images/*.md5sum
          retention-days: 90
          if-no-files-found: error

      # 13. 最终清理
      - name: Final Cleanup
        if: always()
        run: |
          sudo rm -rf ./build ./output ./logs ./build-image.log
          sudo sync
        shell: bash
